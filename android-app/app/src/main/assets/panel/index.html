<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GOLD FIRE — ADVANCED TEST PANEL</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">GOLD FIRE — TEST PANEL</div>
      <div class="topbar-actions">
        <button id="btnFloatingOverlay" class="btn-primary" type="button">Floating Panel</button>
      </div>
    </header>

    <nav class="module-tabs" id="moduleTabs" aria-label="Security Test Sections">
      <button class="tab active" data-section="aim">Aim Test</button>
      <button class="tab" data-section="esp">ESP Test</button>
      <button class="tab" data-section="overlay">Overlay Test</button>
      <button class="tab" data-section="movement">Movement</button>
      <button class="tab" data-section="damage">Damage</button>
      <button class="tab" data-section="firerate">Fire Rate</button>
      <button class="tab" data-section="anticheat">Anti-Cheat</button>
      <button class="tab" data-section="connection">Connection</button>
    </nav>

    <main id="panelViewport" class="viewport"></main>
  </div>

  <script src="panel.js"></script>
</body>
</html>
